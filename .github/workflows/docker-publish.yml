name: Build Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_channel:
        description: Build dev, or publish an explicitly approved stable release
        type: choice
        options:
          - dev
          - stable
        default: dev
        required: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/deepdaddyttv/sakurarr

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute app version
        id: version
        run: |
          APP_VERSION="$(tr -d '\r\n' < VERSION)"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Validate manual build request
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Manual image publishing is only allowed from main."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_channel == 'dev')) }}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_channel == 'stable' }}
            type=raw,value=stable,enable=${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_channel == 'stable' }}
            type=raw,value=${{ steps.version.outputs.app_version }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.release_channel == 'stable' }}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.app_version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
