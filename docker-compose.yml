services:
  tcbscanner:
    image: ghcr.io/deepdaddyttv/sakurarr:latest
    container_name: tcb_scanner
    restart: unless-stopped
    user: "0:0"
    ports:
      - 18080:8080
    volumes:
      - ./data:/data
      - ./manga:/manga
      - ./manhwa:/manhwa
    environment:
      TZ: "America/New_York"
      LIBRARY_DIRS: "/manga,/manhwa"
